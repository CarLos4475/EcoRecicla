services:
  - type: web
    name: ecorecicla
    runtime: php
    region: oregon
    plan: free
    buildCommand: composer install
    startCommand: php -S 0.0.0.0:$PORT index.php
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: require
